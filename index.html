  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ocation:<\u002Fspan>\n    <button sc-camel-on-click=\"{{ closeCountry }}\" style=\"background:none;border:0;cursor:pointer;padding:4px;display:flex\" aria-label=\"Close\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\"><path d=\"M3 3L17 17M17 3L3 17\" stroke=\"#0e8fb8\" stroke-width=\"2.4\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:stretch;gap:10px\">\n    <div style=\"flex:{{ ddFlex }};display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d6dcdf;padding:8px 12px;font-size:17px;color:#1f3a44;min-width:0\">\n      <span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#2a8fb8;display:inline-block\"><\u002Fspan>\n      <span style=\"flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">United Kingdom<\u002Fspan>\n      <span style=\"width:1px;height:22px;background:#d6dcdf\"><\u002Fspan>\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 16 16\"><polyline points=\"3,6 8,11 13,6\" fill=\"none\" stroke=\"#0e8fb8\" stroke-width=\"2\"><\u002Fpolyline><\u002Fsvg>\n    <\u002Fdiv>\n    <button style=\"flex:none;background:#0fa37f;color:#fff;border:0;font:700 16px 'Varah';padding:0 12px;cursor:pointer;min-height:44px\">{{ goLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px\">\n  <div style=\"background:#8dc63f;color:#fff;font-weight:700;font-size:26px;letter-spacing:-0.5px;padding:8px 10px;line-height:1\">SAMARITANS<\u002Fdiv>\n  <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-expanded=\"{{ menuOpen }}\" style=\"display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font:400 18px 'Varah';color:#1c5b69;min-height:44px;padding:0\">\n    Menu\n    <svg width=\"28\" height=\"24\" sc-camel-view-box=\"0 0 28 24\"><path d=\"M0 3H28M0 12H28M0 21H28\" stroke=\"#1c5b69\" stroke-width=\"4\"><\u002Fpath><\u002Fsvg>\n  <\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#1c5b69;padding:8px 20px 20px;display:flex;flex-direction:column\">\n  <a href=\"#\" style=\"color:#fff;text-decoration:none;font-weight:700;font-size:19px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.25)\">How we can help<\u002Fa>\n  <a href=\"#\" style=\"color:#fff;text-decoration:none;font-weight:700;font-size:19px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.25)\">Support us<\u002Fa>\n  <a href=\"#\" style=\"color:#fff;text-decoration:none;font-weight:700;font-size:19px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.25)\">Donate now<\u002Fa>\n  <a href=\"#\" style=\"color:#fff;text-decoration:none;font-weight:700;font-size:19px;padding:14px 0\">Contact a Samaritan<\u002Fa>\n  <div style=\"display:flex;align-items:center;background:#fff;height:44px;padding:0 12px;margin-top:8px\">\n    <input placeholder=\"Search our website\" style=\"flex:1;border:0;outline:0;font:16px 'Varah';color:#1f3a44;min-width:0\">\n    <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 20 20\"><circle cx=\"11\" cy=\"8\" r=\"5.5\" fill=\"none\" stroke=\"#8dc63f\" stroke-width=\"2.6\"><\u002Fcircle><path d=\"M7 12L3 16.5\" stroke=\"#8dc63f\" stroke-width=\"3\"><\u002Fpath><\u002Fsvg>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<!-- Intro hero -->\n<div style=\"background:#11a385;position:relative;overflow:hidden\">\n  <div style=\"position: relative; max-width: 1272px; margin: 0 auto; padding: 55px 24px 60px\">\n    <div style=\"margin-bottom:48px\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:40px;font-size:13px;font-weight:600;color:#fff\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\"><path d=\"M1 8L8 1.5L15 8V15H1Z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg>\n      <a href=\"#\" style=\"color:#fff;text-decoration:none\">Home<\u002Fa>\n      <svg width=\"8\" height=\"10\" sc-camel-view-box=\"0 0 8 10\"><polyline points=\"2,1 6,5 2,9\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\"><\u002Fpolyline><\u002Fsvg>\n      <a href=\"#\" style=\"color:#fff;text-decoration:none\">How we can help<\u002Fa>\n    <\u002Fdiv>\n      <h1 style=\"margin:0 0 25px;color:#fff;font-size:54px;font-weight:700;line-height:1.2;text-wrap:pretty\">Contact a Samaritan<\u002Fh1>\n      <p style=\"margin: 0; color: #fff; font-size: 28px; font-weight: 700; line-height: 1.5; max-width: 820px; text-wrap: pretty\">If you need someone to talk to, we listen. We won’t judge or tell you what to do.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"position:relative;background:#fff;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px;align-items:stretch\">\n        <div style=\"position: absolute; left: -7px; top: -7px; width: 90px; height: 62px; border-top: 7px solid #8dc63f; border-left: 7px solid #8dc63f\"><\u002Fdiv>\n        <div style=\"padding: 30px 30px 34px; padding-top: 50px; padding-right: 50px; padding-bottom: 50px; padding-left: 50px\">\n        <h2 style=\"margin: 0 0 24px; font-size: 32px; font-weight: 600; color: #123f47; margin-bottom: 8px\">Call us any time, day or night<\u002Fh2>\n        <p style=\"margin: 0 0 30px; font-size: 18px; line-height: 1.6; color: #1f3a44\">Whatever you're going through, you can call us any time, from any phone for FREE.<\u002Fp>\n        <a href=\"tel:116123\" style=\"position:relative;display:flex;align-items:center;justify-content:space-between;background:#123f47;color:#fff;text-decoration:none;padding:22px 30px;font-size:24px;font-weight:600\">\n          <span style=\"position: absolute; left: -6px; top: -6px; width: 60px; height: 60px; border-top: 6px solid #8dc63f; border-left: 6px solid #8dc63f\"><\u002Fspan>\n          Call 116 123\n          <svg data-chev=\"\" width=\"22\" height=\"38\" sc-camel-view-box=\"0 0 22 38\" style=\"transition:transform .2s ease\"><polyline points=\"3,3 18,19 3,35\" fill=\"none\" stroke=\"#8fa9ae\" stroke-width=\"3.5\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"#\" style=\"display: inline-block; margin-top: 24px; font-size: 16px; color: #004455\">Contact Samaritans by phone using Relay UK<\u002Fa>\n        <\u002Fdiv><div style=\"position: absolute; left: 30px; top: -6px; width: 6px; height: 24px; background: #8dc63f; border-radius: 100px\"><\u002Fdiv>\n        <div style=\"position: absolute; left: -6px; top: 30px; width: 24px; height: 6px; background: #8dc63f; border-radius: 100px\"><\u002Fdiv>\n        \n        <img src=\"e1e549b7-4cac-4ed7-a327-519efaa69993\" alt=\"A young man looking at his phone in a dimly lit room\" style=\"width:100%;height:100%;min-height:260px;object-fit:cover;display:block\">\n      <\u002Fdiv>\n      <div style=\"position:relative;margin-top: 56px; display: flex; flex-direction: {{ chatDir }}; align-items: flex-start; gap: {{ chatGap }}; background: #fff; padding: 32px 36px\">\n        <div aria-hidden=\"true\" style=\"position: absolute; left: -7px; top: -7px; width: 90px; height: 62px; border-top: 7px solid #8dc63f; border-left: 7px solid #8dc63f\"><\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position: absolute; left: 30px; top: -6px; width: 6px; height: 24px; background: #8dc63f; border-radius: 100px\"><\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position: absolute; left: -6px; top: 30px; width: 24px; height: 6px; background: #8dc63f; border-radius: 100px\"><\u002Fdiv>\n        <span aria-hidden=\"true\" style=\"position:absolute;right:0;bottom:50px;width:26px;height:6px;background:#11a385;border-radius:3px 0 0 3px\"><\u002Fspan>\n        <span aria-hidden=\"true\" style=\"position:absolute;right:50px;bottom:0;width:6px;height:26px;background:#11a385;border-radius:3px 3px 0 0\"><\u002Fspan>\n        <img src=\"5385b788-5964-4d7b-9cf8-dba84a584c8e\" alt=\"\" aria-hidden=\"true\" style=\"flex: none; width: {{ chatIconW }}; height: auto; display: block\">\n        <div style=\"flex:1;min-width:0;width:100%\">\n        <h2 style=\"margin: 0 0 16px; color: #045; font-size: 24px; font-weight: 700; line-height: 1.3; margin-bottom: 6px\"><a href=\"#\" style=\"color:#045;text-decoration:none;display:inline-flex;align-items:center;gap:10px\">Chat with us online<\u002Fa><\u002Fh2>\n        <p style=\"margin: 0; color: #045; font-size: 18px; line-height: 1.3; text-wrap: pretty; max-width: 700px\">Talk to one of our listening volunteers using our new web chat service.<\u002Fp>\n        <a href=\"#\" style=\"position: relative; display: flex; width: {{ chatBtnW }}; align-items: center; justify-content: space-between; gap: 30px; margin-top: 22px; background: #123f47; color: #fff; text-decoration: none; padding: 22px 30px; font-size: 24px; font-weight: 600; padding-top: 12px; padding-bottom: 12px; padding-left: 20px; padding-right: 20px\">\n          <span aria-hidden=\"true\" style=\"position:absolute;left:-6px;top:-6px;width:60px;height:60px;border-top:6px solid #8dc63f;border-left:6px solid #8dc63f\"><\u002Fspan>\n          <span style=\"font-size: 20px\">Chat online<\u002Fspan>\n          <svg data-chev=\"\" width=\"22\" height=\"38\" sc-camel-view-box=\"0 0 22 38\" style=\"flex: none; transition: transform .2s ease; width: 16px\"><polyline points=\"3,3 18,19 3,35\" fill=\"none\" stroke=\"#8fa9ae\" stroke-width=\"3.5\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- What happens -->\n<div style=\"background-color: #F3F7F8\">\n  <div style=\"max-width: 1238px; margin: 0 auto; padding: 66px 24px 80px; margin-top: 0px; margin-bottom: 0px\">\n    <h2 style=\"margin: 0 0 24px; font-size: 38px; font-weight: 600; color: #123f47; margin-bottom: 44px; text-align: center\">What happens when you call us?<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:{{ whGridCols }};gap:{{ whGap }}\">\n    <div style=\"display:grid;grid-template-columns:{{ whCardCols }};column-gap:32px;align-content:start\">\n      <div style=\"position:relative;grid-row:{{ whImgRow }};align-self:start\">\n        <span aria-hidden=\"true\" style=\"position:absolute;left:-6px;top:-6px;width:60px;height:60px;border-top:6px solid #8dc63f;border-left:6px solid #8dc63f;z-index:1\"><\u002Fspan>\n        \n        <span aria-hidden=\"true\" style=\"position:absolute;right:-6px;bottom:-6px;width:60px;height:60px;border-bottom:6px solid #f7c33c;border-right:6px solid #f7c33c;z-index:1\"><\u002Fspan>\n        <img src=\"1fb5382b-54a0-4545-a133-cd25fadeb22a\" alt=\"A Samaritans volunteer answering the phone at a desk\" style=\"width:100%;aspect-ratio:240/131;object-fit:cover;display:block\">\n      <\u002Fdiv>\n      <h3 style=\"margin: 22px 0 12px; font-size: 18px; font-weight: 700; line-height: 1.5; color: #045; text-wrap: pretty; margin-bottom: 6px; margin-top: {{ whH3Mt }}\">A volunteer will answer<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#045;text-wrap:pretty\">If you phone us, we will answer with something like “Samaritans, can I help you?”<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ whCardCols }};column-gap:32px;align-content:start\">\n      <div style=\"position:relative;grid-row:{{ whImgRow }};align-self:start\">\n        <span aria-hidden=\"true\" style=\"position:absolute;left:-6px;top:-6px;width:60px;height:60px;border-top:6px solid #8dc63f;border-left:6px solid #8dc63f;z-index:1\"><\u002Fspan>\n        \n        <span aria-hidden=\"true\" style=\"position:absolute;right:-6px;bottom:-6px;width:60px;height:60px;border-bottom:6px solid #f7c33c;border-right:6px solid #f7c33c;z-index:1\"><\u002Fspan>\n        <img src=\"340e6af2-a2d0-444d-8a06-4ea744870147\" alt=\"A young woman sitting at a café table looking at her phone\" style=\"width:100%;aspect-ratio:240/131;object-fit:cover;display:block\">\n      <\u002Fdiv>\n      <h3 style=\"margin: 22px 0 12px; font-size: 18px; font-weight: 700; line-height: 1.5; color: #045; text-wrap: pretty; margin-bottom: 6px; margin-top: {{ whH3Mt }}\">You talk, we listen<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#045;text-wrap:pretty\">We listen to you and help you talk through your concerns, worries and troubles.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ whCardCols }};column-gap:32px;align-content:start\">\n      <div style=\"position:relative;grid-row:{{ whImgRow }};align-self:start\">\n        <span aria-hidden=\"true\" style=\"position:absolute;left:-6px;top:-6px;width:60px;height:60px;border-top:6px solid #8dc63f;border-left:6px solid #8dc63f;z-index:1\"><\u002Fspan>\n        \n        <span aria-hidden=\"true\" style=\"position:absolute;right:-6px;bottom:-6px;width:60px;height:60px;border-bottom:6px solid #f7c33c;border-right:6px solid #f7c33c;z-index:1\"><\u002Fspan>\n        <img src=\"59fbde24-5563-42f0-af5c-146c3a8eaa71\" alt=\"A Samaritans volunteer wearing a headset\" style=\"width:100%;aspect-ratio:240/131;object-fit:cover;display:block\">\n      <\u002Fdiv>\n      <h3 style=\"margin: 22px 0 12px; font-size: 18px; font-weight: 700; line-height: 1.5; color: #045; text-wrap: pretty; margin-bottom: 6px; margin-top: {{ whH3Mt }}\">We give you space to be yourself<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#045;text-wrap:pretty\">We’ll focus on your thoughts and feelings, and may ask questions to help you explore how you feel.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ whCardCols }};column-gap:32px;align-content:start\">\n      <div style=\"position:relative;grid-row:{{ whImgRow }};align-self:start\">\n        <span aria-hidden=\"true\" style=\"position:absolute;left:-6px;top:-6px;width:60px;height:60px;border-top:6px solid #8dc63f;border-left:6px solid #8dc63f;z-index:1\"><\u002Fspan>\n        \n        <span aria-hidden=\"true\" style=\"position:absolute;right:-6px;bottom:-6px;width:60px;height:60px;border-bottom:6px solid #f7c33c;border-right:6px solid #f7c33c;z-index:1\"><\u002Fspan>\n        <img src=\"5d575441-e4b8-439e-8f5d-e6ba64017af1\" alt=\"A young woman looking out of a window\" style=\"width:100%;aspect-ratio:240/131;object-fit:cover;display:block\">\n      <\u002Fdiv>\n      <h3 style=\"margin: 22px 0 12px; font-size: 18px; font-weight: 700; line-height: 1.5; color: #045; text-wrap: pretty; margin-bottom: 6px; margin-top: {{ whH3Mt }}\">We won’t tell you what you should do<\u002Fh3>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#045;text-wrap:pretty\">We won’t make decisions for you, our advice or opinions are not important for the call. You can hang up whenever you like.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Stories of hope -->\n<div style=\"background:#6e2b61\">\n  <div style=\"max-width:1024px;margin:0 auto;padding:80px 24px 90px\">\n    <h2 style=\"margin:0 0 30px;text-align:center;color:#fff;font-size:38px;font-weight:700\">Stories of hope<\u002Fh2>\n    <p style=\"margin: 0 auto 80px; text-align: center; color: #fff; font-size: 22px; line-height: 1.6; max-width: 100%; text-wrap: pretty\">These stories are real reminders that, step-by-step, we all have what it takes to overcome what’s troubling us.<\u002Fp>\n    <div style=\"position:relative;width:100%;aspect-ratio:16/9;background:#000\">\n      <sc-if value=\"{{ videoIdle }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ playVideo }}\" aria-label=\"Play Nick's story - Samaritans\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;background:#000\">\n          <img src=\"9e88fb56-605a-41e8-ae48-b66f1dd7fffe\" alt=\"Nick's story - Samaritans\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n          <span styl 002Fspan><span style=\"font-size:42px;font-weight:600\">116 123<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:24px 0 0;font-size:18px;line-height:1.6\">Call us free, day or night, 365 days a year<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#6e2a5e;color:#fff;padding:40px 40px;width:340px;max-width:100%;min-height:228px\">\n      <div style=\"display:flex;align-items:center;gap:14px;justify-content:space-between\"><span style=\"font-size:28px;font-weight:600;display:flex;align-items:center;gap:14px\">Newsletter <svg width=\"12\" height=\"20\" sc-camel-view-box=\"0 0 12 20\"><polyline points=\"2,2 10,10 2,18\" fill=\"none\" stroke=\"#3ab7e8\" stroke-width=\"2.6\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span style=\"width:46px;height:34px;background:#f7c33c;border-top:8px solid #2a8fb8;display:inline-block\"><\u002Fspan><\u002Fdiv>\n      <p style=\"margin:24px 0 0;font-size:18px;line-height:1.6\">Stay on top of our latest news and updates<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-top:70px\">\n    <div style=\"display:flex;gap:16px\">\n      <sc-for list=\"{{ socials }}\" as=\"s\" hint-placeholder-count=\"5\"><span style=\"width:18px;height:18px;background:#1c5b69;border-radius:3px;display:inline-block\"><\u002Fspan><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:26px;flex-wrap:wrap\">\n      <sc-for list=\"{{ legal }}\" as=\"g\" hint-placeholder-count=\"7\"><a href=\"#\" style=\"font-size:15px;color:#0a8a68;text-decoration:none\">{{ g }}<\u002Fa><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:60px 0 0;max-width:720px;font-size:12px;line-height:1.7;color:#4b6168\">Samaritans is a charity registered in England and Wales (219432) and in Scotland (SC040604) and incorporated in England and Wales as a company limited by guarantee (757372). Samaritans Ireland is a charity registered in the Republic of Ireland (20033668) and incorporated in the Republic of Ireland as a company limited by guarantee (450409). Samaritans Enterprises is a private limited company (01451175).<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { mobile: false, menu: false, vw: typeof window !== \"undefined\" ? window.innerWidth : 1280, playing: false, open: 0, tab: 0, country: true };\n  componentDidMount() { this._rs = () => this.setState(s => ({ vw: s.mobile ? 375 : window.innerWidth })); window.addEventListener(\"resize\", this._rs); this._rs(); }\n  componentWillUnmount() { window.removeEventListener(\"resize\", this._rs); }\n  renderVals() {\n    const qs = [\n      [\"I'm d/Deaf, have hearing loss or a speech impairment\", \"\", null, null, null, null, [{\"p\":true,\"text\":\"You may prefer to contact Samaritans by phone using Relay UK.\"},{\"p\":true,\"text\":\"Relay UK helps people who are d/Deaf, have hearing loss or have a speech impairment to make phone calls. A Relay Assistant can support the call by:\"},{\"ul\":true,\"items\":[\"typing what the caller is saying, so you can read it\",\"reading out what you type, so the volunteer can hear your response\"]},{\"p\":true,\"text\":\"When you’ve downloaded the Relay UK app to your smartphone or tablet, you can dial 18001 44 116 123 to contact Samaritans. You can also use the same number to contact us with a textphone.\"},{\"p\":true,\"text\":\"The Relay UK service is free. Calls to Samaritans on 116 123 are also free, so contacting us using the Relay UK service will not incur any charges.\"},{\"p\":true,\"text\":\"For information about confidentiality, please see the [[Relay UK terms and conditions]].\"}]],\n      [\"Is contacting you free?\", \"Yes.\", [\n        { h: \"On the phone\", ps: [\"This number is free to call from both landlines and mobiles, including pay-as-you-go mobiles. You do not need to have any credit or call allowance on your plan to call 116 123.\"] },\n        { h: \"In person\", ps: [\"Visiting us face-to-face in your local branch is free.\"] },\n        { h: \"By letter\", ps: [\"Yes. But please make sure you include first line of our address to make sure your letter gets to us for free.\", \"Freepost SAMARITANS LETTERS\"] }\n      ]],\n      [\"Is the service confidential?\", \"Yes, Samaritans maintains confidentiality even after the death of a caller unless except in certain situations which are:\", null, [\"We have informed consent from a caller to pass on information\",\"We call an ambulance because a caller appears to be incapable of making rational decisions for themselves\",\"We receive a court order requiring us to divulge information or are required to do so by nation specific legislation\",\"We are passed information about acts of terrorism, bomb warnings, or threats to life\",\"A caller attacks or threatens any Samaritans person including behaviours that are abusive/threatening and sexually inappropriate.\",\"A caller deliberately prevents the service from being delivered to other callers\",\"An identifiable child or an adult at risk are being, have been, or are at risk of being harmed, in which case we may contact the relevant services in line with our safeguarding policy.\",\"When a caller discloses that action(s) they intend to carry out, that carry a risk of serious physical harm being caused to a third person (or persons), we will act to protect people from that threat when suitable identifying information is available. This will involve contacting the emergency services with or without caller consent.\"]],\n      [\"How quickly will you respond?\", \"\", [{\"h\":\"On the phone\",\"ps\":[\"When you call us on 116 123, you will be put through to a volunteer at one of more than 200 branches and locations across the UK and Ireland.\",\"We aim for everyone to get through to someone straight away, but sometimes this is not always possible as it depends on the number of volunteers we have on the phones at that time.\",\"The number also won’t come up on your phone bill.\"]},{\"h\":\"In person\",\"ps\":[\"You can check our branches opening times [[here]]. It can be helpful to call ahead and arrange a time to come in.\"]},{\"h\":\"By letter\",\"ps\":[\"When you write us a letter we aim to respond within 7 days.\"]}]],\n      [\"What can I speak to you about?\", \"People contact us with all sorts of concerns and what might be a small issue to you may be huge to someone else.\", null, [\"relationship and family problems\",\"loss, including loss of a friend or a family member through bereavement\",\"financial worries\",\"job-related stress\",\"college or study-related stress\",\"loneliness and isolation\",\"depression\",\"painful and/or disabling physical illness\",\"heavy use of or dependency on alcohol or other drugs\",\"thoughts of suicide\"], [\"You could be going through something new or have been struggling to cope for some time, either way, we're here if you feel you need some extra support.\",\"If what’s getting to you isn’t on this list, please still get in touch.\",\"Common reasons people contact us are:\"], [\"We won’t make decisions for you, and we'll support the decisions you make.\",\"You are the expert on your own life. Our advice or opinions are not important.\",\"If you want advice, we may be able to give you contact details for organisations that specialise in helping with specific problems and situations.\"]],\n      [\"How many times can I call?\", \"\", null, null, null, null, [{\"p\":true,\"text\":\"We are here for you when you are struggling to cope and feeling suicidal. We know many people will struggle multiple times or benefit from talking to us more than once and that's fine. You can call us several times if you need to.\"},{\"p\":true,\"text\":\"If you start calling us very frequently, we will limit the number of calls that you can make. This is because we want as many people as possible get the right support when they need it, to ensure that we can offer everyone a better service.\"},{\"h\":true,\"text\":\"What counts as frequent calls?\"},{\"p\":true,\"text\":\"By frequent calls we mean:\"},{\"ul\":true,\"items\":[\"If you make 100 calls or more within a rolling 30-day period.\",\"Or if you spend 20 hours or more within a rolling 30-day period talking to volunteers.\"]},{\"p\":true,\"text\":\"If when calling the helpline, you hear a recorded message “we would like to talk to you about how you use our service”, you will be asked to contact the Caller Support Team by leaving a voicemail with your name, contact number, and if we can leave you a voice message or not.\"},{\"p\":true,\"text\":\"A Caller Support Officer will then call you back to talk to you about:\"},{\"ul\":true,\"items\":[\"how you use our services\",\"why you might be having to use our services more\",\"suggest other places where you can get help that will better meet your needs\",\"if a support plan can be agreed so you still get to talk to our volunteers.\"]},{\"p\":true,\"text\":\"If you do not call the Caller Support team, or we cannot get to speak with you, or after our conversation, we feel the restriction should remain in place then your number will remain restricted for 30 days.\"},{\"p\":true,\"text\":\"If you've received a message asking you to contact the Caller Support Team, you can find out more information [[here]]\"},{\"p\":true,\"text\":\"For more information about how we use your personal data, please see our [[privacy policy]]\"}]],\n      [\"Accessibility and ways to contact us\", \"We want our services to be as accessible as possible for anyone who wants to contact us.\", null, null, [\"You can find information below about different ways to get in touch. We know that people’s access needs are different, so we also welcome feedback on your experience of contacting us. You can share feedback by emailing [[feedback@samaritans.org]].\"]]\n    ];\n    const narrow = this.state.vw < 840, wide = !narrow;\n    co ate.mobile ? \"0 0 0 1px #dfe5e7, 0 8px 40px rgba(0,68,85,0.15)\" : \"none\", previewLabel: this.state.mobile ? \"View desktop version\" : \"View mobile version\", toggleMobile: () => this.setState(s => ({ mobile: !s.mobile, vw: !s.mobile ? 375 : window.innerWidth })), chatBtnW: this.state.vw < 600 ? \"100%\" : \"fit-content\", chatDir: this.state.vw < 600 ? \"column\" : \"row\", chatGap: this.state.vw < 600 ? \"20px\" : \"56px\", chatIconW: this.state.vw < 600 ? \"42.5px\" : \"85px\", ...(() => { const t = this.state.vw >= 600 && this.state.vw < 1024; return { whGridCols: t ? \"minmax(0,1fr)\" : \"repeat(auto-fit,minmax(min(100%,220px),1fr))\", whGap: t ? \"48px\" : \"88px\", whCardCols: t ? \"minmax(0,2fr) minmax(0,3fr)\" : \"minmax(0,1fr)\", whImgRow: t ? \"1 / 4\" : \"auto\", whH3Mt: t ? \"0px\" : \"22px\" }; })(), desktopHeader: this.state.vw >= 1024, compactHeader: this.state.vw < 1024, goLabel: this.state.vw < 480 ? \"Go\" : \"Continue\", ddFlex: this.state.vw < 480 ? \"1 1 auto\" : \"0 1 252px\", menuOpen: this.state.menu, toggleMenu: () => this.setState(s => ({ menu: !s.menu })), gridCols: wide ? \"minmax(0,2fr) minmax(0,3fr)\" : \"minmax(0,1fr)\", tabs, panel, videoPlaying: this.state.playing, videoIdle: !this.state.playing, playVideo: () => this.setState({ playing: true }),\n      related: [\n        { title: \"If you're having a difficult time\", body: \"What to do if you're not feeling okay.\" },\n        { title: \"Signs you may be struggling to cope\", body: \"Some things to look out for in yourself, or someone you know. Read more.\" },\n        { title: \"If you're worried about someone else\", body: \"What to do if you think someone you know isn't okay.\" }\n      ],\n      footerCols: [\n        { title: \"How we can help\", arrow: true, links: [\"Contact a Samaritan\", \"If you're having a difficult time\", \"If you're worried about someone else\", \"Talk to us on the phone\", \"Complaints, concerns and feedback\"] },\n        { title: \"Support u
